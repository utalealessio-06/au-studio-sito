<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Progetto dimostrativo: sito vetrina per un panificio (negozio inventato) -->
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d89a5b"/>
      <stop offset="1" stop-color="#a5622f"/>
    </linearGradient>
    <linearGradient id="crust2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b77a"/>
      <stop offset="1" stop-color="#b9783f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="#f7f0e5"/>

  <!-- Menu -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="64" y="52" font-size="28" fill="#4a2f1c" font-style="italic">Panificio Rosa</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b5240">
    <text x="520" y="50">Il forno</text>
    <text x="608" y="50">Prodotti</text>
    <text x="700" y="50">Orari</text>
    <text x="770" y="50">Dove siamo</text>
  </g>
  <rect x="908" y="24" width="228" height="42" rx="21" fill="#25a35a"/>
  <text x="1022" y="50" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Scrivici su WhatsApp</text>
  <rect x="0" y="90" width="1200" height="1" fill="#e2d3bd"/>

  <!-- Apertura -->
  <text x="64" y="190" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#c0643b" font-weight="700">TRASTEVERE · DAL 1987</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#3b2a1e">
    <text x="64" y="270">Il pane di quartiere,</text>
    <text x="64" y="342">sfornato ogni mattina</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b5240">
    <text x="64" y="400">Pane a lievitazione naturale, pizza bianca e dolci</text>
    <text x="64" y="428">della tradizione romana. Ordina su WhatsApp e passa a ritirare.</text>
  </g>
  <rect x="64" y="466" width="210" height="54" rx="27" fill="#c0643b"/>
  <text x="169" y="499" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Ordina il pane</text>
  <rect x="290" y="466" width="210" height="54" rx="27" fill="none" stroke="#4a2f1c" stroke-width="2"/>
  <text x="395" y="499" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#4a2f1c" text-anchor="middle">Vieni a trovarci</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b5240">
    <circle cx="72" cy="568" r="5" fill="#25a35a"/>
    <text x="86" y="573">Aperto ora · chiude alle 20:00</text>
  </g>

  <circle cx="900" cy="370" r="250" fill="#ecdcc3"/>
  <circle cx="900" cy="370" r="250" fill="none" stroke="#c0643b" stroke-width="2" stroke-dasharray="2 10"/>
  <!-- pagnotta -->
  <ellipse cx="860" cy="410" rx="170" ry="110" fill="url(#crust)"/>
  <path d="M760 380 q40 -40 80 0 M820 360 q40 -40 80 0 M880 362 q40 -40 80 0" stroke="#f3d9b0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- filone -->
  <rect x="890" y="200" width="250" height="92" rx="46" fill="url(#crust2)" transform="rotate(-16 1015 246)"/>
  <path d="M930 260 l30 -26 M985 245 l30 -26 M1040 230 l30 -26" stroke="#f6e2c2" stroke-width="6" stroke-linecap="round" transform="rotate(-6 1000 240)"/>
  <!-- spighe -->
  <g stroke="#b88a4a" stroke-width="3" fill="none">
    <path d="M700 560 q30 -60 20 -130"/>
    <path d="M712 470 q-20 -6 -26 -24 M716 500 q-20 -6 -26 -24 M716 470 q18 -10 20 -28 M720 500 q18 -10 20 -28"/>
  </g>

  <!-- Prodotti -->
  <rect x="0" y="680" width="1200" height="520" fill="#fffaf2"/>
  <text x="64" y="750" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#c0643b" font-weight="700">OGGI IN VETRINA</text>
  <text x="64" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#3b2a1e">I nostri prodotti</text>
  <text x="1136" y="800" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c0643b" text-anchor="end">Vedi tutti →</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <g>
      <rect x="64" y="840" width="248" height="200" rx="14" fill="#efe1cb"/>
      <ellipse cx="188" cy="948" rx="82" ry="56" fill="url(#crust)"/>
      <path d="M140 930 q20 -20 40 0 M180 925 q20 -20 40 0" stroke="#f3d9b0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="64" y="1076" font-size="18" fill="#3b2a1e" font-weight="700">Pagnotta di Lariano</text>
      <text x="64" y="1102" font-size="15" fill="#6b5240">€4,50 al kg</text>
    </g>
    <g>
      <rect x="336" y="840" width="248" height="200" rx="14" fill="#efe1cb"/>
      <rect x="370" y="912" width="180" height="56" rx="28" fill="url(#crust2)" transform="rotate(-12 460 940)"/>
      <path d="M400 950 l16 -16 M440 942 l16 -16 M480 934 l16 -16" stroke="#f6e2c2" stroke-width="5" stroke-linecap="round"/>
      <text x="336" y="1076" font-size="18" fill="#3b2a1e" font-weight="700">Filone casereccio</text>
      <text x="336" y="1102" font-size="15" fill="#6b5240">€3,80 al kg</text>
    </g>
    <g>
      <rect x="608" y="840" width="248" height="200" rx="14" fill="#efe1cb"/>
      <path d="M672 960 q60 -90 120 0 q-60 30 -120 0z" fill="url(#crust2)"/>
      <path d="M700 948 q32 -40 64 0 M716 960 q16 -50 32 0" stroke="#a5622f" stroke-width="3" fill="none"/>
      <text x="608" y="1076" font-size="18" fill="#3b2a1e" font-weight="700">Maritozzo con la panna</text>
      <text x="608" y="1102" font-size="15" fill="#6b5240">€2,50</text>
    </g>
    <g>
      <rect x="880" y="840" width="256" height="200" rx="14" fill="#efe1cb"/>
      <rect x="920" y="900" width="176" height="84" rx="10" fill="#e9c58f"/>
      <g fill="#d39a58"><circle cx="950" cy="925" r="5"/><circle cx="990" cy="950" r="5"/><circle cx="1030" cy="922" r="5"/><circle cx="1066" cy="956" r="5"/><circle cx="1010" cy="970" r="4"/></g>
      <text x="880" y="1076" font-size="18" fill="#3b2a1e" font-weight="700">Pizza bianca</text>
      <text x="880" y="1102" font-size="15" fill="#6b5240">€12,00 al kg</text>
    </g>
  </g>

  <!-- Orari e dove siamo -->
  <rect x="0" y="1200" width="1200" height="300" fill="#4a2f1c"/>
  <text x="64" y="1270" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#f7f0e5">Orari</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e6d3bb">
    <text x="64" y="1316">Lunedì – Sabato</text><text x="420" y="1316" text-anchor="end">7:00 – 20:00</text>
    <rect x="64" y="1332" width="356" height="1" fill="#6e4f38"/>
    <text x="64" y="1362">Domenica</text><text x="420" y="1362" text-anchor="end">7:30 – 13:30</text>
    <rect x="64" y="1378" width="356" height="1" fill="#6e4f38"/>
    <text x="64" y="1414">Via della Lungaretta · Roma</text>
  </g>
  <rect x="560" y="1240" width="576" height="220" rx="14" fill="#5d4130"/>
  <g stroke="#6f5240" stroke-width="2">
    <path d="M560 1300 h576 M560 1380 h576 M700 1240 v220 M880 1240 v220 M1020 1240 v220"/>
    <path d="M560 1440 L1136 1260" stroke="#8a6a52" stroke-width="10"/>
  </g>
  <path d="M848 1316 c0 -26 40 -26 40 0 c0 20 -20 38 -20 38 s-20 -18 -20 -38z" fill="#c0643b"/>
  <circle cx="868" cy="1316" r="7" fill="#4a2f1c"/>
</svg>
