  <rect x="20" y="544" width="320" height="52" rx="26" fill="none" stroke="#4a2f1c" stroke-width="2"/>
  <text x="180" y="576" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4a2f1c" text-anchor="middle">Vieni a trovarci</text>

