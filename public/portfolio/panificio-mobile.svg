  </defs>
  <rect width="360" height="760" fill="#f7f0e5"/>
  <text x="20" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#4a2f1c">Panificio Rosa</text>
  <path d="M310 36 h26 M310 44 h26 M310 52 h26" stroke="#4a2f1c" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="0" y="72" width="360" height="1" fill="#e2d3bd"/>

  <text x="20" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#c0643b">TRASTEVERE · DAL 1987</text>
