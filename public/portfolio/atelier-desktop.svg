    <text x="600" y="1360" font-size="17" font-weight="700" fill="#2a2226">Spedizione in 48 ore</text>
    <text x="600" y="1388" font-size="15" fill="#5d4e53">o ritiro gratuito in negozio</text>
    <text x="960" y="1360" font-size="17" font-weight="700" fill="#2a2226">Reso facile</text>
    <text x="960" y="1388" font-size="15" fill="#5d4e53">entro 14 giorni</text>
